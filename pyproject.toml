[project]
name = "mijia-curtain-ble"
version = "0.1.0"
description = "Direct BLE control for Xiaomi/Aqara curtain companion (lumi.curtain.hmcn02) via MIoT BLE spec"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
    "cryptography>=42",
    "pycryptodome>=3.24.1",
    "qrcode[pil]>=8.2",
    "requests>=2.34.2",
]

[project.scripts]
curtain = "mibleak.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mibleak"]
